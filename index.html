<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi Art Studio | Makeup Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fcfbf9; color: #1a1a1a; -webkit-font-smoothing: antialiased; }
        .studio-logo { 
            font-family: 'Cormorant Garamond', serif; 
            font-size: 2.2rem; 
            letter-spacing: 0.05em; 
            text-transform: uppercase; 
            font-weight: 300;
            line-height: 1.2;
        }
        .hidden { display: none !important; }
        .modal-bg { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px); position: fixed; top:0; left:0; width:100%; height:100%; z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        input { border-radius: 0 !important; border-bottom: 1px solid #e5e5e5 !important; background: transparent; transition: border-color 0.3s; width: 100%; padding: 12px 0; font-size: 15px; color: #1a1a1a; }
        input::placeholder { color: #aaa; font-style: italic; font-size: 14px; }
        input:focus { border-bottom: 1px solid #1a1a1a !important; outline: none; }
        .btn-select { border: 1px solid #e5e5e5; padding: 14px; font-size: 13px; text-align: left; cursor: pointer; transition: 0.2s; margin-bottom: 8px; display: block; width: 100%; background: #ffffff; }
        .btn-select.active { background: #1a1a1a; color: white; border-color: #1a1a1a; font-weight: 600; }
        .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; border-bottom: 2px solid #1a1a1a; display: inline-block; padding-bottom: 3px; margin-bottom: 20px; }
        .label-text { font-size: 11px; font-weight: 600; text-transform: uppercase; color: #888; letter-spacing: 0.08em; margin-bottom: 6px; display: block; }
        .tab-btn { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; padding: 12px 16px; border-bottom: 2px solid transparent; color: #888; cursor: pointer; }
        .tab-btn.active { color: #1a1a1a; border-bottom-color: #1a1a1a; font-weight: 700; }
    </style>
</head>
<body class="pb-32">

<div id="app" class="max-w-md mx-auto px-6 py-8 sm:py-12">
    <!-- Language Selection -->
    <div class="flex justify-end gap-3 mb-8 text-[11px] tracking-widest text-gray-400 font-medium">
        <button onclick="changeLang('en')" id="lang-en" class="hover:text-black">EN</button>
        <span class="text-gray-300">|</span>
        <button onclick="changeLang('ko')" id="lang-ko" class="hover:text-black font-bold text-black">한국어</button>
        <span class="text-gray-300">|</span>
        <button onclick="changeLang('man')" id="lang-man" class="hover:text-black">普通话</button>
        <span class="text-gray-300">|</span>
        <button onclick="changeLang('can')" id="lang-can" class="hover:text-black">廣東話</button>
    </div>

    <!-- Header -->
    <header class="text-center mb-8">
        <h1 class="studio-logo text-gray-900">Hi Art Studio</h1>
        <p id="sub-title" class="text-[10px] uppercase tracking-[0.25em] text-gray-400 mt-2 italic font-light">보충 수업 신청</p>
    </header>

    <!-- Navigation Tabs (신청서 vs 내역 확인) -->
    <div class="flex justify-center border-b border-gray-200 mb-8">
        <button id="tab-new" onclick="switchTab('new')" class="tab-btn active">보충 수업 신청</button>
        <button id="tab-history" onclick="switchTab('history')" class="tab-btn">예약 내역 확인 <span id="history-badge" class="ml-1 bg-black text-white text-[9px] px-1.5 py-0.5 rounded-full hidden">0</span></button>
    </div>

    <!-- 1. NEW BOOKING FORM TAB -->
    <div id="view-new" class="space-y-10">
        <!-- Saturday Notice Banner -->
        <div id="sat-notice-banner" class="bg-gray-100 border-l-2 border-black p-4 text-xs text-gray-800 font-medium flex items-center gap-2">
            <span>[안내] 토요일 4개 반 추가 신설 - 보충 수업 신청 가능!</span>
        </div>

        <!-- 1. Student Info -->
        <section class="bg-white p-6 border border-gray-100 shadow-sm">
            <div class="space-y-6">
                <div>
                    <label id="label-name" class="label-text">학생 성함 *</label>
                    <input type="text" id="student-name" placeholder="예: Lan Kim">
                </div>
                <div>
                    <label id="label-grade" class="label-text">학년</label>
                    <input type="text" id="student-grade" placeholder="예: Year 2...">
                </div>
            </div>
        </section>

        <!-- 2. Absence Class -->
        <section class="bg-white p-6 border border-gray-100 shadow-sm">
            <h2 id="head-cancel" class="section-title">결석 예정 수업</h2>
            <div class="space-y-6">
                <div>
                    <label id="label-cancel-date" class="label-text">결석 날짜 *</label>
                    <input type="date" id="cancel-date" onchange="updateCancelTimeSlots()">
                </div>
                <div id="cancel-time-area" class="hidden">
                    <label id="label-cancel-time" class="label-text">기존 수업 시간 *</label>
                    <div id="cancel-time-slots" class="mt-3"></div>
                </div>
            </div>
        </section>

        <!-- 3. Makeup Request -->
        <section id="makeup-section" class="hidden bg-white p-6 border border-gray-100 shadow-sm">
            <h2 id="head-makeup" class="section-title">보충 신청 수업</h2>
            <div class="space-y-6 mt-2">
                <button id="btn-decide-later" onclick="decideLater()" class="w-full border border-black py-4 text-xs uppercase tracking-widest font-bold hover:bg-gray-50 transition">
                    보충 날짜는 나중에 결정하겠습니다
                </button>
                
                <div id="decide-now-area" class="space-y-6">
                    <div class="text-center py-1 text-[10px] text-gray-300 italic tracking-widest">—— 또는 ——</div>
                    <div>
                        <label id="label-makeup-date" class="label-text">보충 희망 날짜</label>
                        <input type="date" id="makeup-date" onchange="updateMakeupTimeSlots()">
                    </div>
                    <div id="makeup-time-area" class="hidden">
                        <label id="label-makeup-time" class="label-text">선택 가능한 시간</label>
                        <div id="makeup-time-slots" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 4. Final Submit Button -->
        <section id="final-section" class="hidden">
            <button id="btn-submit-main" onclick="showFinalNotice()" class="w-full bg-black text-white py-5 text-xs uppercase tracking-[0.25em] font-bold shadow-lg hover:bg-gray-800 transition">
                신청서 제출
            </button>
        </section>
    </div>

    <!-- 2. HISTORY VIEW TAB -->
    <div id="view-history" class="hidden space-y-6">
        <h2 id="history-title" class="text-xs font-bold uppercase tracking-widest text-gray-900 border-b border-gray-200 pb-3">예약 신청 내역</h2>
        <div id="history-list" class="space-y-4"></div>
    </div>
</div>

<!-- Modal -->
<div id="modal" class="modal-bg hidden">
    <div class="max-w-xs w-full bg-white p-8 shadow-2xl text-center border border-gray-100 relative">
        <p id="modal-msg" class="text-xs text-gray-700 leading-relaxed mb-8 font-normal whitespace-pre-line"></p>
        <div id="modal-actions" class="flex flex-col gap-2">
            <button id="modal-close-btn" onclick="closeModal()" class="w-full bg-black text-white py-3 text-xs font-bold uppercase tracking-widest">확인</button>
            <button id="modal-cancel-btn" onclick="closeModal()" class="hidden w-full border border-gray-300 py-3 text-xs text-gray-500 uppercase tracking-widest">닫기</button>
        </div>
    </div>
</div>

            finalNotice: "這僅是申請。主課老師 Lan Kim 將通過短信確認。提前 24 小時申請將處理取消，但補課位置確認可能需要時間。",

            btnCancelReq: "取消預約",

    const scheduleData = [
        // 1 Hour Classes
        { day: 'Mon', time: '05:20 - 06:20', dur: 1 }, 
        { day: 'Tue', time: '03:20 - 04:20', dur: 1 }, 
        { day: 'Tue', time: '04:30 - 05:30', dur: 1 }, 
        { day: 'Wed', time: '03:50 - 04:50', dur: 1 }, 
        { day: 'Thu', time: '04:00 - 05:00', dur: 1 }, 
        { day: 'Fri', time: '03:50 - 04:50', dur: 1 },
        { day: 'Sat', time: '09:40 - 10:40', dur: 1 }, // 신설 토요일 1시간반
        
        // 1.5 Hour Classes
        { day: 'Mon', time: '03:40 - 05:10', dur: 1.5 }, 
        { day: 'Mon', time: '05:20 - 06:50', dur: 1.5 }, 
        { day: 'Tue', time: '05:50 - 07:20', dur: 1.5 }, 
        { day: 'Wed', time: '03:40 - 05:10', dur: 1.5 }, 
        { day: 'Wed', time: '05:30 - 07:00', dur: 1.5 }, 
        { day: 'Thu', time: '04:00 - 05:30', dur: 1.5 },

        // 2 Hour Classes
        { day: 'Mon', time: '04:00 - 06:00', dur: 2 }, 
        { day: 'Tue', time: '03:40 - 05:40', dur: 2 }, 
        { day: 'Wed', time: '05:20 - 07:20', dur: 2 }, 
        { day: 'Thu', time: '05:40 - 07:40', dur: 2 }, 
        { day: 'Fri', time: '05:20 - 07:20', dur: 2 },
        { day: 'Sat', time: '10:50 - 12:50', dur: 2 }  // 신설 토요일 2시간반
    ];

    let currentLang = 'ko';
    let selectedDur = 0;
    let absentDayName = ""; 
    let cancelInfo = "";
    let makeupInfo = "";
    let selectedCancelSlot = null;

    function changeLang(lang) {
        currentLang = lang;
        const t = translations[lang];
        document.getElementById('sub-title').innerText = t.subTitle;
        document.getElementById('head-cancel').innerText = t.headCancel;
        document.getElementById('label-name').innerText = t.labelName;
        document.getElementById('label-grade').innerText = t.labelGrade;
        document.getElementById('label-cancel-date').innerText = t.labelCancelDate;
        document.getElementById('label-cancel-time').innerText = t.labelCancelTime;
        document.getElementById('head-makeup').innerText = t.headMakeup;
        document.getElementById('label-makeup-date').innerText = t.labelMakeupDate;
        document.getElementById('label-makeup-time').innerText = t.labelMakeupTime;
        document.getElementById('btn-decide-later').innerText = t.btnLater;
        document.getElementById('btn-submit-main').innerText = t.btnSubmit;
        document.getElementById('tab-new').innerText = t.tabNew;
        document.getElementById('tab-history').childNodes[0].nodeValue = t.tabHistory + " ";
        document.getElementById('history-title').innerText = t.historyTitle;
        document.getElementById('sat-notice-banner').innerText = t.saturdayNotice;
        document.getElementById('student-name').placeholder = (lang === 'ko' ? "예: Lan Kim" : "e.g. Lan Kim");
        document.getElementById('student-grade').placeholder = (lang === 'ko' ? "예: Year 2..." : "e.g. Year 2...");
        
        ['en','ko','man','can'].forEach(l => {
            const btn = document.getElementById('lang-' + l);
            if(l === lang) btn.className = "hover:text-black font-bold text-black";
            else btn.className = "hover:text-black";
        });

        renderHistory();
    }

    function switchTab(tab) {
        if(tab === 'new') {
            document.getElementById('view-new').classList.remove('hidden');
            document.getElementById('view-history').classList.add('hidden');
            document.getElementById('tab-new').classList.add('active');
            document.getElementById('tab-history').classList.remove('active');
        } else {
            document.getElementById('view-new').classList.add('hidden');
            document.getElementById('view-history').classList.remove('hidden');
            document.getElementById('tab-new').classList.remove('active');
            document.getElementById('tab-history').classList.add('active');
            renderHistory();
        }
    }

    function updateCancelTimeSlots() {
        const val = document.getElementById('cancel-date').value;
        if(!val) return;
        const dateParts = val.split('-');
        const dateObj = new Date(dateParts[0], dateParts[1]-1, dateParts[2]);
        const dayName = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dateObj.getDay()];
        const container = document.getElementById('cancel-time-slots');
        container.innerHTML = "";
        
        scheduleData.filter(s => s.day === dayName).forEach(slot => {
            const btn = document.createElement('button');
            btn.className = "btn-select";
            btn.innerText = `${slot.time} (${slot.dur}h)`;
            btn.onclick = () => {
                let [startHour, startMin] = slot.time.split(' - ')[0].split(':');
                let hourInt = parseInt(startHour);
                if (dayName !== 'Sat' && hourInt < 12) hourInt += 12;
                
                const classTime = new Date(dateParts[0], dateParts[1]-1, dateParts[2], hourInt, parseInt(startMin));
                if ((classTime - new Date()) < (24 * 60 * 60 * 1000)) {
                    showModal(translations[currentLang].policyBlock);
                    document.getElementById('makeup-section').classList.add('hidden');
                    return;
                }

                selectedDur = slot.dur;
                absentDayName = dayName; 
                selectedCancelSlot = slot;
                cancelInfo = `${val} (${dayName}) ${slot.time}`;
                document.querySelectorAll('#cancel-time-slots .btn-select').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('makeup-section').classList.remove('hidden');
            };
            container.appendChild(btn);
        });
        document.getElementById('cancel-time-area').classList.remove('hidden');
    }

    function updateMakeupTimeSlots() {
        const val = document.getElementById('makeup-date').value;
        if(!val) return;
        const dateParts = val.split('-');
        const dateObj = new Date(dateParts[0], dateParts[1]-1, dateParts[2]);
        const dayName = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dateObj.getDay()];

        // 일요일 차단
        if(dayName === 'Sun') {
            showModal(translations[currentLang].sunMsg);
            document.getElementById('makeup-date').value = "";
            document.getElementById('makeup-time-area').classList.add('hidden');
            return;
        }

        // 기존 결석 요일과 동일한 요일 차단
        if(dayName === absentDayName) {
            showModal(translations[currentLang].dayConflictMsg);
            document.getElementById('makeup-date').value = "";
            document.getElementById('makeup-time-area').classList.add('hidden');
            return;
        }

        const container = document.getElementById('makeup-time-slots');
        container.innerHTML = "";
        const slots = scheduleData.filter(s => s.day === dayName && s.dur === selectedDur);
        
        if(slots.length > 0) {
            document.getElementById('makeup-time-area').classList.remove('hidden');
            slots.forEach(slot => {
                const b = document.createElement('button');
                b.className = "btn-select";
                b.innerText = slot.time;
                b.onclick = () => {
                    makeupInfo = `${val} (${dayName}) ${slot.time}`;
                    document.querySelectorAll('#makeup-time-slots .btn-select').forEach(x => x.classList.remove('active'));
                    b.classList.add('active');
                    document.getElementById('final-section').classList.remove('hidden');
                };
                container.appendChild(b);
            });
        } else {
            container.innerHTML = `<p class='text-xs text-gray-400 italic py-2'>No matching classes this day for ${selectedDur}h duration.</p>`;
        }
    }

    function decideLater() {
        makeupInfo = translations[currentLang].btnLater;
        showModal(translations[currentLang].laterNotice);
        document.getElementById('makeup-time-area').classList.add('hidden');
        document.getElementById('final-section').classList.remove('hidden');
    }

    function showFinalNotice() {
        const name = document.getElementById('student-name').value;
        if(!name) { alert("Student Name is required."); return; }
        
        showModal(
            translations[currentLang].finalNotice,
            translations[currentLang].confirmBtn,
            sendFinalSMS
        );
    }

    function sendFinalSMS() {
        const name = document.getElementById('student-name').value;
        const grade = document.getElementById('student-grade').value;

        // Save local history
        saveBookingRecord({
            id: 'REQ-' + Date.now(),
            name: name,
            grade: grade || 'N/A',
            cancel: cancelInfo,
            makeup: makeupInfo,
            date: new Date().toLocaleDateString(),
            status: 'active'
        });

        const msg = `[Hi Art Studio Request]\nStudent: ${name}\nGrade: ${grade}\n- Absent: ${cancelInfo}\n- Makeup: ${makeupInfo}`;
        window.location.href = `sms:0405068004?body=${encodeURIComponent(msg)}`;
        closeModal();
    }

    function showModal(text, btnText = "확인", confirmHandler = null) {
        document.getElementById('modal-msg').innerText = text;
        const btn = document.getElementById('modal-close-btn');
        const cancelBtn = document.getElementById('modal-cancel-btn');
        btn.innerText = btnText;
        
        if (confirmHandler) {
            btn.onclick = confirmHandler;
            cancelBtn.classList.remove('hidden');
            cancelBtn.onclick = closeModal;
        } else {
            btn.onclick = closeModal;
            cancelBtn.classList.add('hidden');
        }
        document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('modal').classList.add('hidden'); }

    // LOCAL STORAGE HISTORY MANAGEMENT
    function getRecords() {
        try {
            return JSON.parse(localStorage.getItem('hi_art_bookings') || '[]');
        } catch(e) { return []; }
    }

    function saveBookingRecord(record) {
        const records = getRecords();
        records.unshift(record);
        localStorage.setItem('hi_art_bookings', JSON.stringify(records));
        updateBadge();
    }

    function updateBadge() {
        const records = getRecords().filter(r => r.status === 'active');
        const badge = document.getElementById('history-badge');
        if(records.length > 0) {
            badge.innerText = records.length;
            badge.classList.remove('hidden');
        } else {
            badge.classList.add('hidden');
        }
    }

    function renderHistory() {
        const records = getRecords();
        const container = document.getElementById('history-list');
        const t = translations[currentLang];
        updateBadge();

        if(records.length === 0) {
            container.innerHTML = `<div class='bg-white p-6 text-center text-xs text-gray-400 border border-gray-100'>${t.noHistory}</div>`;
            return;
        }

        container.innerHTML = "";
        records.forEach(req => {
            const isCancelled = req.status === 'cancelled';
            const card = document.createElement('div');
            card.className = `bg-white p-5 border text-xs space-y-3 ${isCancelled ? 'border-gray-200 opacity-60' : 'border-gray-200 shadow-sm'}`;
            
            card.innerHTML = `
                <div class="flex justify-between items-center pb-2 border-b border-gray-100">
                    <span class="font-bold text-gray-900 text-sm">${req.name} <span class="text-xs text-gray-400 font-normal">(${req.grade})</span></span>
                    <span class="text-[10px] px-2 py-0.5 font-bold ${isCancelled ? 'bg-rose-100 text-rose-800' : 'bg-emerald-100 text-emerald-800'}">
                        ${isCancelled ? t.statusCancelled : t.statusActive}
                    </span>
                </div>
                <div class="space-y-1 text-gray-700">
                    <p><strong class="text-gray-400 uppercase text-[10px] block">Absent Class</strong> ${req.cancel}</p>
                    <p><strong class="text-gray-400 uppercase text-[10px] block mt-2">Makeup Slot</strong> ${req.makeup}</p>
                </div>
                ${!isCancelled ? `
                    <div class="pt-2 border-t border-gray-100 flex justify-end">
                        <button onclick="cancelBooking('${req.id}')" class="text-rose-600 font-bold text-[11px] hover:underline">${t.btnCancelReq}</button>
                    </div>
                ` : ''}
            `;
            container.appendChild(card);
        });
    }

    function cancelBooking(id) {
        const t = translations[currentLang];
        showModal(t.cancelConfirmMsg, t.btnCancelReq, () => {
            const records = getRecords();
            const target = records.find(r => r.id === id);
            if(target) {
                target.status = 'cancelled';
                localStorage.setItem('hi_art_bookings', JSON.stringify(records));
                renderHistory();
                
                // Cancel SMS
                const smsMsg = `[Hi Art Studio Request - CANCELLED]\nStudent: ${target.name}\n- Cancelled Absent Class: ${target.cancel}\n(This makeup booking has been cancelled.)`;
                window.location.href = `sms:0405068004?body=${encodeURIComponent(smsMsg)}`;
            }
            closeModal();
        });
    }

    // Initialize
    changeLang('ko');
</script>
</body>
</html>
